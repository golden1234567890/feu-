<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feu° — Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#101012;
    --white:#ffffff;
    --off-white:#f7f7f6;
    --chrome-1:#e9e9ea;
    --chrome-2:#c3c3c7;
    --chrome-3:#f6f6f5;
    --chrome-4:#9a9aa0;
    --blue:#1e83ff;
    --line:#e4e4e2;
    --chrome-grad: linear-gradient(115deg, var(--chrome-1) 0%, var(--chrome-2) 35%, var(--chrome-3) 55%, var(--chrome-4) 100%);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;
    background:var(--white);color:var(--ink);
    font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;
  }
  a{color:inherit;text-decoration:none;}
  .chrome-text{
    background:var(--chrome-grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .wrap{max-width:1240px;margin:0 auto;padding:0 32px;width:100%;}

  header{padding:28px 0;}
  nav.wrap{display:flex;align-items:center;justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:10px;font-family:'Archivo Black',sans-serif;font-size:18px;letter-spacing:0.02em;}
  .socials{display:flex;gap:22px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#7a7a7e;}
  .socials a:hover{color:var(--ink);}

  main{flex:1;display:flex;align-items:center;}
  .hero{width:100%;padding:40px 0 60px;text-align:center;}
  .mark{margin:0 auto 30px;width:240px;max-width:60vw;}
  .eyebrow{
    font-size:12px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;
    color:var(--chrome-4);margin:0 0 20px;
  }
  h1{
    font-family:'Archivo Black',sans-serif;
    font-size:clamp(44px,8vw,110px);
    line-height:0.94;letter-spacing:-0.01em;margin:0 0 26px;
  }
  p.sub{
    font-size:16px;color:#55555a;max-width:420px;margin:0 auto 40px;line-height:1.6;
  }
  form.notify{
    display:flex;max-width:420px;margin:0 auto;
    border-bottom:1.5px solid var(--ink);padding-bottom:12px;
  }
  form.notify input{
    flex:1;border:none;background:none;font-size:15px;font-family:inherit;outline:none;
  }
  form.notify button{
    background:var(--ink);color:var(--white);border:none;
    padding:10px 22px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;
    border-radius:2px;cursor:pointer;transition:background .2s ease;
  }
  form.notify button:hover{background:#000;}
  form.notify input:focus-visible, form.notify button:focus-visible, .socials a:focus-visible{outline:2px solid var(--blue);outline-offset:3px;}
  .confirm{font-size:13px;color:var(--ink);margin-top:14px;display:none;}

  footer{padding:26px 0;border-top:1px solid var(--line);}
  .footer-bottom{
    display:flex;justify-content:space-between;font-size:12px;color:#9a9a9e;flex-wrap:wrap;gap:10px;
  }

  @media (max-width:520px){
    .socials{display:none;}
  }
</style>
</head>
<body>

<header>
  <nav class="wrap">
    <a href="#" class="brand" aria-label="Feu°">
      <svg width="22" height="22" viewBox="0 0 640 640" aria-hidden="true">
        <line x1="395" y1="40" x2="365" y2="330" stroke="#101012" stroke-width="70" stroke-linecap="round"/>
        <line x1="421" y1="43" x2="391" y2="333" stroke="#1e83ff" stroke-width="26" stroke-linecap="round"/>
        <line x1="300" y1="360" x2="40" y2="440" stroke="#101012" stroke-width="70" stroke-linecap="round"/>
        <line x1="292" y1="335" x2="32" y2="415" stroke="#1e83ff" stroke-width="26" stroke-linecap="round"/>
        <line x1="330" y1="600" x2="600" y2="300" stroke="#101012" stroke-width="70" stroke-linecap="round"/>
        <line x1="311" y1="583" x2="581" y2="283" stroke="#1e83ff" stroke-width="26" stroke-linecap="round"/>
      </svg>
      FEU°
    </a>
    <div class="socials">
      <a href="#">Instagram</a>
      <a href="#">TikTok</a>
    </div>
  </nav>
</header>

<main>
  <div class="wrap hero">
    <svg class="mark" viewBox="0 0 640 640" aria-hidden="true">
      <line x1="395" y1="40" x2="365" y2="330" stroke="#101012" stroke-width="70" stroke-linecap="round"/>
      <line x1="421" y1="43" x2="391" y2="333" stroke="#1e83ff" stroke-width="26" stroke-linecap="round"/>
      <line x1="300" y1="360" x2="40" y2="440" stroke="#101012" stroke-width="70" stroke-linecap="round"/>
      <line x1="292" y1="335" x2="32" y2="415" stroke="#1e83ff" stroke-width="26" stroke-linecap="round"/>
      <line x1="330" y1="600" x2="600" y2="300" stroke="#101012" stroke-width="70" stroke-linecap="round"/>
      <line x1="311" y1="583" x2="581" y2="283" stroke="#1e83ff" stroke-width="26" stroke-linecap="round"/>
    </svg>
    <p class="eyebrow">Coming soon</p>
    <h1>IT'S <span class="chrome-text">HEATING UP.</span></h1>
    <p class="sub">Feu° is launching soon. Drop your email to be the first to know, before anyone else.</p>
    <form class="notify" id="notifyForm">
      <input type="email" placeholder="Your email" aria-label="Your email" required>
      <button type="submit">Notify me</button>
    </form>
    <p class="confirm" id="confirmMsg">Got it, we'll keep you posted. 🔥</p>
  </div>
</main>

<footer>
  <div class="wrap footer-bottom">
    <span>© 2026 Feu°</span>
    <span>Clothing brand</span>
  </div>
</footer>

<script>
  document.getElementById('notifyForm').addEventListener('submit', function(e){
    e.preventDefault();
    this.style.display = 'none';
    document.getElementById('confirmMsg').style.display = 'block';
  });
</script>

</body>
</html>
